<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#1f6b6e"/>
      <stop offset="0.6" stop-color="#0e3a44"/>
      <stop offset="1" stop-color="#051a21"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff2b8" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffd760"/>
      <stop offset="1" stop-color="#d9932a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4b"/>
      <stop offset="0.55" stop-color="#8a5225"/>
      <stop offset="1" stop-color="#4f2a10"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d3a8"/>
      <stop offset="1" stop-color="#c98d5c"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.75">
    <circle cx="40" cy="190" r="1.8"/><circle cx="364" cy="60" r="1.6"/><circle cx="356" cy="214" r="2"/>
    <circle cx="52" cy="330" r="1.4"/><circle cx="350" cy="330" r="1.4"/><circle cx="300" cy="30" r="1.4"/>
  </g>

  <!-- the blessing pours down into the bowl -->
  <polygon points="172,112 228,112 300,262 100,262" fill="url(#beam)"/>
  <circle cx="200" cy="108" r="78" fill="url(#halo)"/>

  <!-- the buff: a big four-point star -->
  <g filter="url(#glow)">
    <path d="M200,52 C206,92 216,102 256,108 C216,114 206,124 200,164 C194,124 184,114 144,108 C184,102 194,92 200,52 Z"
          fill="url(#star)" stroke="#8f5f17" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- motes falling into the bowl -->
  <g fill="#fff2b8" filter="url(#glow)">
    <circle cx="176" cy="196" r="5"/><circle cx="222" cy="186" r="4"/><circle cx="198" cy="226" r="4.5"/>
    <circle cx="160" cy="240" r="3"/><circle cx="240" cy="232" r="3.5"/>
  </g>

  <!-- the bowl, held up in two hands -->
  <ellipse cx="200" cy="268" rx="104" ry="24" fill="#ffd760" opacity="0.45" filter="url(#glow)"/>
  <path d="M100,264 C104,322 146,352 200,352 C254,352 296,322 300,264 Z"
        fill="url(#wood)" stroke="#3a2306" stroke-width="6" stroke-linejoin="round"/>
  <path d="M124,296 C142,324 170,334 200,334" stroke="#d9a066" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>
  <ellipse cx="200" cy="264" rx="100" ry="20" fill="url(#pool)" stroke="#3a2306" stroke-width="6"/>
  <ellipse cx="200" cy="262" rx="62" ry="9" fill="#fffbe8" opacity="0.8"/>

  <!-- hands: palms under the bowl, thumbs over the rim -->
  <g stroke="#3a2306" stroke-width="6" stroke-linejoin="round" fill="url(#skin)">
    <path d="M58,392 L74,316 C80,292 96,276 112,270 C122,266 130,272 128,282 C126,292 116,300 116,312 C118,330 132,346 148,358 L136,392 Z"/>
    <path d="M342,392 L326,316 C320,292 304,276 288,270 C278,266 270,272 272,282 C274,292 284,300 284,312 C282,330 268,346 252,358 L264,392 Z"/>
  </g>
  <!-- sleeves -->
  <g stroke="#3a2306" stroke-width="6" stroke-linejoin="round" fill="url(#gold)">
    <path d="M50,400 L58,370 L140,382 L132,400 Z"/>
    <path d="M350,400 L342,370 L260,382 L268,400 Z"/>
  </g>

  <!-- speech bubble: "please?" -->
  <g transform="translate(82,80) scale(0.85)">
    <path d="M-44,-30 H44 C56,-30 62,-24 62,-12 V12 C62,24 56,30 44,30 H6 L-10,50 L-12,30 H-44 C-56,30 -62,24 -62,12 V-12 C-62,-24 -56,-30 -44,-30 Z"
          fill="#fff8e6" stroke="#3a2306" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#8a5225">
      <circle cx="-26" cy="0" r="8"/><circle cx="0" cy="0" r="8"/><circle cx="26" cy="0" r="8"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M330,112 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M300,172 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 z"/>
    <path d="M86,200 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
  </g>
</svg>
